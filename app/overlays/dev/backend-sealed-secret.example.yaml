# PLACEHOLDER — secret cho môi trường dev.
# SealedSecret bị ràng buộc với namespace, nên phải seal LẠI cho ecommerce-dev:
#
#   kubectl create secret generic backend-secret \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=FRONTEND_ORIGIN='...' \
#     --from-literal=PORT='8080' \
#     -n ecommerce-dev --dry-run=client -o yaml \
#   | kubeseal --format yaml \
#       --controller-name sealed-secrets \
#       --controller-namespace <NAMESPACE_CUA_CONTROLLER> \
#   > backend-sealed-secret.yaml
#
# Sau đó bỏ comment dòng backend-sealed-secret.yaml trong kustomization.yaml.
