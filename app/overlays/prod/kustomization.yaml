apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../base
  - namespace.yaml
  - backend-sealed-secret.yaml
patches:
  - path: replicas-patch.yaml
  - target: { kind: Ingress, name: ecommerce-ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: k8s.nguyendat.tech
