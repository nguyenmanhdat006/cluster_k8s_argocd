# Application cho môi trường staging. Apply tay 1 lần (hoặc apply cả thư mục argocd/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenmanhdat006/cluster_k8s_argocd
    targetRevision: main
    path: app/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
